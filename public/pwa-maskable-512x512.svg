<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <!-- Full-bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="#0a0710" />

  <!-- Pixel Vinyl Disc (Scale 11, offset 80,80 — strictly within center 80% safe zone) -->
  <g transform="translate(80, 80) scale(11)">
    <!-- Outer pixel disc boundary -->
    <rect x="10" y="2" width="12" height="2" fill="#141419" />
    <rect x="6" y="4" width="20" height="2" fill="#141419" />
    <rect x="4" y="6" width="24" height="2" fill="#141419" />
    <rect x="2" y="10" width="28" height="12" fill="#141419" />
    <rect x="4" y="22" width="24" height="2" fill="#141419" />
    <rect x="6" y="24" width="20" height="2" fill="#141419" />
    <rect x="10" y="26" width="12" height="2" fill="#141419" />

    <!-- Disc grooves (subtle retro highlight) -->
    <rect x="12" y="5" width="8" height="1" fill="#2d2d38" />
    <rect x="7" y="8" width="4" height="1" fill="#2d2d38" />
    <rect x="21" y="8" width="4" height="1" fill="#2d2d38" />
    <rect x="5" y="12" width="2" height="8" fill="#2d2d38" />
    <rect x="25" y="12" width="2" height="8" fill="#2d2d38" />
    <rect x="7" y="23" width="4" height="1" fill="#2d2d38" />
    <rect x="21" y="23" width="4" height="1" fill="#2d2d38" />
    <rect x="12" y="25" width="8" height="1" fill="#2d2d38" />

    <!-- Center Label (Retro Pink / Magenta Accent) -->
    <rect x="13" y="11" width="6" height="1" fill="#e85fa8" />
    <rect x="11" y="12" width="10" height="8" fill="#e85fa8" />
    <rect x="13" y="20" width="6" height="1" fill="#e85fa8" />

    <!-- Center Spindle Hole -->
    <rect x="15" y="15" width="2" height="2" fill="#141419" />
    <rect x="15" y="14" width="2" height="1" fill="#fff" opacity="0.3" />
  </g>
</svg>
